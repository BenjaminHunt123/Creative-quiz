<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Creative Careers Quiz</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{background:linear-gradient(135deg,#6a11cb,#2575fc);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}.quiz-container{background:#fff;max-width:800px;width:100%;padding:30px;border-radius:20px;box-shadow:0 15px 40px rgba(0,0,0,.2)}h1{text-align:center;margin-bottom:15px}.progress{text-align:center;margin-bottom:20px;font-weight:bold}.question{font-size:1.4rem;margin-bottom:20px}.answers{display:grid;gap:12px}.answer-btn{border:none;background:#f1f3f6;padding:15px;border-radius:12px;cursor:pointer;text-align:left}.answer-btn:hover{background:#dbe8ff}.correct{background:#4caf50!important;color:#fff}.wrong{background:#e53935!important;color:#fff}.feedback{margin-top:15px;font-weight:bold;min-height:30px}.next-btn,.restart{margin-top:20px;padding:12px 25px;border:none;border-radius:10px;color:#fff;cursor:pointer}.next-btn{background:#2575fc;display:none}.restart{background:#4caf50}.results{text-align:center;display:none}.score{font-size:2rem;color:#2575fc;margin:20px 0}</style></head><body><div class="quiz-container"><div id="quiz"><h1>🎨 Creative Careers Quiz</h1><div id="progress" class="progress"></div><div id="question" class="question"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><button id="nextBtn" class="next-btn">Next Question</button></div><div id="results" class="results"><h2>Quiz Complete!</h2><div id="finalScore" class="score"></div><div id="careerBadge"></div><button class="restart" onclick="restartQuiz()">Play Again</button></div></div><script>const quizData=[{question:'Which creative professional designs logos, branding and visual marketing materials?',answers:['Animator','Graphic Designer','Actor','Musician'],correct:1},{question:'Who creates moving characters and visual effects for films and games?',answers:['Animator','Photographer','Illustrator','Copywriter'],correct:0},{question:'Which career focuses on writing advertising slogans and promotional content?',answers:['Architect','Copywriter','Editor','Fashion Designer'],correct:1},{question:'Who is responsible for planning and directing a film production?',answers:['Director','Journalist','Sound Engineer','Web Designer'],correct:0},{question:'Which professional captures images using a camera?',answers:['Photographer','Animator','Actor','Producer'],correct:0},{question:'Who designs clothing and fashion collections?',answers:['Graphic Designer','Fashion Designer','Author','Producer'],correct:1},{question:'Which creative role focuses on designing websites and user experiences?',answers:['UX Designer','Singer','Actor','Ceramic Artist'],correct:0},{question:'Who creates original drawings for books, magazines and media?',answers:['Illustrator','Director','Musician','Architect'],correct:0},{question:'Which professional edits video content for films, social media and TV?',answers:['Video Editor','Photographer','Dancer','Writer'],correct:0},{question:'Who creates music and soundtracks for entertainment projects?',answers:['Architect','Composer','Publisher','Editor'],correct:1}];let currentQuestion=0,score=0;const q=document.getElementById('question'),a=document.getElementById('answers'),f=document.getElementById('feedback'),n=document.getElementById('nextBtn'),p=document.getElementById('progress');function load(){f.textContent='';n.style.display='none';const d=quizData[currentQuestion];p.textContent=`Question ${currentQuestion+1} of ${quizData.length}`;q.textContent=d.question;a.innerHTML='';d.answers.forEach((ans,i)=>{const b=document.createElement('button');b.className='answer-btn';b.textContent=ans;b.onclick=()=>sel(b,i);a.appendChild(b)})}function sel(btn,i){const d=quizData[currentQuestion];const all=document.querySelectorAll('.answer-btn');all.forEach(x=>x.disabled=true);if(i===d.correct){score++;btn.classList.add('correct');f.textContent='✅ Correct!'}else{btn.classList.add('wrong');all[d.correct].classList.add('correct');f.textContent='❌ Not quite!'}n.style.display='inline-block'}n.onclick=()=>{currentQuestion++;currentQuestion<quizData.length?load():show()};function show(){document.getElementById('quiz').style.display='none';document.getElementById('results').style.display='block';document.getElementById('finalScore').textContent=`${score} / ${quizData.length}`;document.getElementById('careerBadge').textContent=score>=8?'🏆 Creative Industry Expert':'🎨 Future Creative Professional'}function restartQuiz(){currentQuestion=0;score=0;document.getElementById('quiz').style.display='block';document.getElementById('results').style.display='none';load()}load();</script></body></html>
